resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    client_max_body_size 200m;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 使用变量 + Docker 内置 DNS，上游容器重建后无需重启 nginx
    location /api/crawler/ {
        set $up behavior-consumer:9105;
        proxy_pass http://$up;
        proxy_set_header Host $host;
    }

    location /api/music/ {
        set $up behavior-consumer:9105;
        proxy_pass http://$up;
        proxy_set_header Host $host;
    }

    location /music/ {
        alias /data/music/;
        types {
            audio/mp4 m4a m4s;
            audio/mpeg mp3;
            text/vtt vtt;
        }
        add_header Accept-Ranges bytes;
    }

    location /api/ {
        set $up gateway-service:9100;
        proxy_pass http://$up;
        proxy_set_header Host $host;
    }
}
