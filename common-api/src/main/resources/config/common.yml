# 各服务共享配置：由 common-api 打进 classpath，各服务通过
# spring.config.import: optional:classpath:config/common.yml 引入。
# 只放"所有服务一致"的配置；端口、应用名、Kafka 收发细节等差异项留在各服务自己的 application.yml。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/recommend?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: root
    password: ${MYSQL_ROOT_PASSWORD:root123}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_ADDR:kafka:9092}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.rs.api.entity
  configuration:
    map-underscore-to-camel-case: true

dubbo:
  registry:
    address: nacos://${NACOS_ADDR:nacos:8848}
  provider:
    timeout: 3000
