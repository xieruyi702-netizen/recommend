services:
  mysql:
    image: mysql:8.0
    container_name: rs-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: recommend
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: rs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: rs-kafka
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  nacos:
    image: nacos/nacos-server:v2.3.0
    platform: linux/amd64
    container_name: rs-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  gateway-service:
    build: { context: ., dockerfile: gateway-service/Dockerfile }
    container_name: rs-gateway
    volumes:
      - music-data:/data/music
    environment: &java-env
      MYSQL_HOST: mysql
      # SMTP（QQ邮箱）：export SMTP_USERNAME=xxx@qq.com SMTP_PASSWORD=授权码 后 up -d 生效；留空=验证码打印日志的模拟模式
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MYSQL_ROOT_PASSWORD: root123
      REDIS_HOST: redis
      KAFKA_ADDR: kafka:9092
      NACOS_ADDR: nacos:8848
    ports:
      - "9100:9100"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      nacos: { condition: service_healthy }

  recall-service:
    build: { context: ., dockerfile: recall-service/Dockerfile }
    container_name: rs-recall
    environment: *java-env
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }

  coarse-rank-service:
    build: { context: ., dockerfile: coarse-rank-service/Dockerfile }
    container_name: rs-coarse
    environment: *java-env
    depends_on:
      nacos: { condition: service_healthy }

  rank-service:
    build: { context: ., dockerfile: rank-service/Dockerfile }
    container_name: rs-rank
    environment: *java-env
    depends_on:
      mysql: { condition: service_healthy }
      nacos: { condition: service_healthy }

  rerank-service:
    build: { context: ., dockerfile: rerank-service/Dockerfile }
    container_name: rs-rerank
    environment: *java-env
    depends_on:
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }

  behavior-consumer:
    build: { context: ., dockerfile: behavior-consumer/Dockerfile }
    container_name: rs-consumer
    environment: *java-env
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  frontend:
    build: { context: ./frontend }
    container_name: rs-frontend
    volumes:
      - music-data:/data/music:ro
    ports:
      - "80:80"
    depends_on:
      - gateway-service

volumes:
  mysql-data:
  music-data:
