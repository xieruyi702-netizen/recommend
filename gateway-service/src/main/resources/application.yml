server:
  port: 9100

spring:
  application:
    name: gateway-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/recommend?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: root
    password: ${MYSQL_ROOT_PASSWORD:root123}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
  kafka:
    bootstrap-servers: ${KAFKA_ADDR:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

dubbo:
  application:
    name: gateway-service
  registry:
    address: nacos://${NACOS_ADDR:nacos:8848}
  consumer:
    check: false
    timeout: 3000

logging:
  level:
    root: info

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.rs.api.entity
  configuration:
    map-underscore-to-camel-case: true
